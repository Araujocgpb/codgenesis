<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aulas da Trilha — CodGenesis</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  
  <div class="app-container">
    <header>
      <div class="logo-container">
        <a href="trilhas.html" style="text-decoration: none; font-size: 1.25rem; margin-right: 8px;">←</a>
        <span class="logo-text">CodGenesis</span>
      </div>
      <div class="header-user-info">
        <span id="user-name-display">Estudante</span>
      </div>
    </header>

    <main>
      <div class="mb-20">
        <span id="trilha-breadcrumb" style="font-size: 0.8rem; font-weight: 700; color: var(--accent); text-transform: uppercase;">Trilha</span>
        <h2 id="trilha-titulo" style="font-family: var(--font-family-title); font-size: 1.75rem; font-weight: 800; margin-top: 4px;">Carregando...</h2>
      </div>

      <!-- Sessão de Progresso da Trilha -->
      <div style="background-color: var(--background); padding: 16px; border-radius: var(--radius-lg); margin-bottom: 24px;">
        <div class="progress-header">
          <span style="font-size: 0.85rem; font-weight: 600; color: var(--text-muted);">Progresso na Trilha</span>
          <span id="trilha-progresso-percent" class="progress-percentage">0%</span>
        </div>
        <div class="progress-container" style="margin-bottom: 0; margin-top: 8px;">
          <div id="trilha-progresso-bar" class="progress-fill"></div>
        </div>
      </div>

      <!-- Lista de Aulas -->
      <h3 style="font-family: var(--font-family-title); font-size: 1.15rem; font-weight: 700; margin-bottom: 12px;">Aulas</h3>
      <div class="aulas-list" id="aulas-container">
        <div class="text-center" style="padding: 40px 0; color: var(--text-muted);">
          Carregando aulas...
        </div>
      </div>
    </main>

    <nav class="bottom-nav">
      <a href="trilhas.html" class="bottom-nav-item active">
        <span class="icon">📚</span>
        <span>Trilhas</span>
      </a>
      <a href="progresso.html" class="bottom-nav-item">
        <span class="icon">📊</span>
        <span>Progresso</span>
      </a>
    </nav>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/offline.js"></script>
  <script src="data/conteudos.js"></script>
  <script src="js/aulas.js"></script>
</body>
</html>
