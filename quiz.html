<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz da Aula — CodGenesis</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  
  <div class="app-container">
    <header>
      <div class="logo-container">
        <a id="back-to-aula-btn" href="#" style="text-decoration: none; font-size: 1.25rem; margin-right: 8px;">←</a>
        <span class="logo-text">CodGenesis</span>
      </div>
      <div class="header-user-info">
        <span id="user-name-display">Estudante</span>
      </div>
    </header>

    <main>
      <div class="mb-20">
        <span id="quiz-meta-title" style="font-size: 0.8rem; font-weight: 700; color: var(--accent); text-transform: uppercase;">QUIZ DE FIXAÇÃO</span>
        <h2 id="aula-titulo-display" style="font-family: var(--font-family-title); font-size: 1.5rem; font-weight: 800; margin-top: 4px;">Carregando Pergunta...</h2>
      </div>

      <div class="quiz-question-container">
        <p id="quiz-question-text" class="quiz-question-text">Pergunta da aula...</p>
        
        <div class="quiz-options" id="quiz-options-container">
          <!-- Alternativas injetadas dinamicamente -->
          <div class="quiz-option">Alternativa 1</div>
          <div class="quiz-option">Alternativa 2</div>
          <div class="quiz-option">Alternativa 3</div>
          <div class="quiz-option">Alternativa 4</div>
        </div>
      </div>

      <div id="quiz-feedback-box" class="quiz-feedback" style="display: none; margin-bottom: 20px;">
        <!-- Feedback de acerto ou erro -->
      </div>

      <div class="aula-actions" style="margin-top: auto;">
        <button id="btn-responder" class="btn btn-primary btn-disabled" disabled>Verificar Resposta</button>
        <a id="btn-proximo-fluxo" href="#" class="btn btn-secondary" style="display: none;">Voltar para as Aulas</a>
      </div>
    </main>

    <nav class="bottom-nav">
      <a href="trilhas.html" class="bottom-nav-item active">
        <span class="icon">📚</span>
        <span>Trilhas</span>
      </a>
      <a href="progresso.html" class="bottom-nav-item">
        <span class="icon">📊</span>
        <span>Progresso</span>
      </a>
    </nav>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/offline.js"></script>
  <script src="data/conteudos.js"></script>
  <script src="js/quiz.js"></script>
</body>
</html>
