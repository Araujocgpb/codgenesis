<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar — CodGenesis</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  
  <div class="app-container">
    <header>
      <div class="logo-container">
        <span class="logo-icon">🌌</span>
        <span class="logo-text">CodGenesis</span>
      </div>
    </header>

    <main style="justify-content: center;">
      <div class="mb-20">
        <h2 style="font-family: var(--font-family-title); font-size: 1.75rem; font-weight: 800;">Acesse sua Conta</h2>
        <p style="color: var(--text-muted); font-size: 0.95rem;">Entre para sincronizar seu progresso de estudos.</p>
      </div>

      <div id="feedback-msg" class="quiz-feedback" style="display: none; margin-bottom: 20px;"></div>

      <form id="login-form" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label class="form-label" for="login-role">Entrar como</label>
          <select id="login-role" class="form-input">
            <option value="aluno">Aluno</option>
            <option value="professor">Professor</option>
            <option value="gestor_escola">Gestor de escola</option>
            <option value="dono">Dono do app</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label" for="login-email">E-mail</label>
          <input type="email" id="login-email" class="form-input" placeholder="seuemail@exemplo.com" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="login-password">Senha</label>
          <input type="password" id="login-password" class="form-input" placeholder="Digite sua senha" required>
        </div>

        <button type="submit" id="submit-btn" class="btn btn-primary mt-20">Entrar</button>
      </form>

      <p class="text-center mt-20" style="font-size: 0.9rem; color: var(--text-muted);">
        Não tem uma conta? <a href="cadastro.html" class="text-link">Criar conta</a>
      </p>
      
      <p class="text-center mt-20">
        <a href="index.html" class="text-link" style="font-size: 0.85rem; font-weight: 500;">← Voltar para o início</a>
      </p>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/offline.js"></script>

  <script>
    async function handleLogin(e) {
      e.preventDefault();
      
      const email = document.getElementById("login-email").value.trim();
      const password = document.getElementById("login-password").value;
      const papel = document.getElementById("login-role").value;
      const feedback = document.getElementById("feedback-msg");
      const btn = document.getElementById("submit-btn");

      feedback.style.display = "none";
      btn.disabled = true;
      btn.textContent = "Carregando...";

      try {
        const result = await loginUser(email, password, papel);
        
        if (result.success) {
          feedback.className = "quiz-feedback success";
          feedback.textContent = result.mode === "offline-mock" 
            ? "Modo de demonstração: Sessão offline inicializada!" 
            : "Entrada realizada com sucesso! Redirecionando...";
          feedback.style.display = "block";
          
          setTimeout(() => {
            window.location.href = roleHome(getCurrentUser());
          }, 1000);
        }
      } catch (err) {
        feedback.className = "quiz-feedback error";
        feedback.textContent = err.message || "Erro desconhecido ao entrar.";
        feedback.style.display = "block";
        btn.disabled = false;
        btn.textContent = "Entrar";
      }
    }
  </script>
</body>
</html>
