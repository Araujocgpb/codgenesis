<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trilhas de Aprendizagem — CodGenesis</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  
  <div class="app-container">
    <header>
      <div class="logo-container">
        <span class="logo-icon">🌌</span>
        <span class="logo-text">CodGenesis</span>
      </div>
      <div class="header-user-info">
        <span id="user-name-display">Estudante</span>
        <a href="perfil.html" class="text-link" style="margin-left:8px;">Perfil</a>
        <a href="professor.html" id="role-dashboard-link" class="text-link" style="margin-left:8px;" hidden></a>
        <a href="#" id="logout-btn">Sair</a>
      </div>
    </header>

    <main>
      <div class="mb-20">
        <h2 style="font-family: var(--font-family-title); font-size: 1.5rem; font-weight: 800;">Suas Trilhas</h2>
        <p style="color: var(--text-muted); font-size: 0.95rem;">Selecione um tema abaixo para iniciar seus estudos.</p>
      </div>

      <div class="cards-container" id="trilhas-container">
        <!-- As trilhas serão injetadas dinamicamente via js/trilhas.js -->
        <div class="text-center" style="padding: 40px 0; color: var(--text-muted);">
          Carregando trilhas...
        </div>
      </div>

      <section class="tarefas-section" aria-labelledby="tarefas-title">
        <div class="section-heading">
          <div>
            <span class="eyebrow">Prática guiada</span>
            <h2 id="tarefas-title">Tarefas de hoje</h2>
          </div>
          <span id="tarefas-contador" class="task-counter">0/0</span>
        </div>
        <div id="tarefas-container" class="tasks-list">
          <p class="text-muted">Carregando tarefas...</p>
        </div>
      </section>
    </main>

    <nav class="bottom-nav">
      <a href="trilhas.html" class="bottom-nav-item active">
        <span class="icon">📚</span>
        <span>Trilhas</span>
      </a>
      <a href="progresso.html" class="bottom-nav-item">
        <span class="icon">📊</span>
        <span>Progresso</span>
      </a>
    </nav>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/offline.js"></script>
  <script src="data/conteudos.js"></script>
  <script src="js/trilhas.js"></script>
  <script src="js/tarefas.js"></script>
</body>
</html>
