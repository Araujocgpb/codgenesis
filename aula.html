<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aula — CodGenesis</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  
  <div class="app-container">
    <header>
      <div class="logo-container">
        <a id="back-btn" href="#" style="text-decoration: none; font-size: 1.25rem; margin-right: 8px;">←</a>
        <span class="logo-text">CodGenesis</span>
      </div>
      <div class="header-user-info">
        <span id="user-name-display">Estudante</span>
      </div>
    </header>

    <main>
      <article>
        <div class="aula-header">
          <span id="aula-trilha-meta" class="aula-header-meta">PROGRAMAÇÃO</span>
          <h2 id="aula-titulo" class="aula-header-title">Carregando aula...</h2>
        </div>

        <div id="aula-conteudo" class="aula-body">
          <!-- Conteúdo dinâmico em HTML da aula injetado aqui -->
          <p>Carregando conteúdo da aula...</p>
        </div>
      </article>

      <div class="aula-actions">
        <!-- Fluxo principal: Concluir aula redireciona para o Quiz -->
        <a id="btn-concluir" href="#" class="btn btn-primary">Fazer Quiz e Concluir Aula</a>
        <a id="btn-proxima" href="#" class="btn btn-secondary btn-disabled">Próxima Aula</a>
      </div>
      <section class="tarefas-section" aria-labelledby="comments-title">
        <div class="section-heading"><h3 id="comments-title">Comentários</h3></div>
        <div id="comments-list"><p class="text-muted">Carregando comentários...</p></div>
        <form id="comment-form" class="mt-20">
          <textarea id="comment-text" class="form-input" rows="3" maxlength="1000" placeholder="Compartilhe uma dúvida ou ideia..." required></textarea>
          <button class="btn btn-outline mt-20" type="submit">Publicar comentário</button>
        </form>
      </section>
    </main>

    <nav class="bottom-nav">
      <a href="trilhas.html" class="bottom-nav-item active">
        <span class="icon">📚</span>
        <span>Trilhas</span>
      </a>
      <a href="progresso.html" class="bottom-nav-item">
        <span class="icon">📊</span>
        <span>Progresso</span>
      </a>
    </nav>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/offline.js"></script>
  <script src="data/conteudos.js"></script>
  <script src="js/comentarios.js"></script>
  <script src="js/aula.js"></script>
</body>
</html>
